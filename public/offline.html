<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0d10">
    <title>Bağlantı yok · Meridyen Roleplay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark light; }
        body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0b0d10; color: #e8eef2; font: 16px/1.6 system-ui, sans-serif; padding: 24px; }
        main { max-width: 28rem; text-align: center; }
        h1 { font-size: 1.75rem; margin: 1rem 0 .5rem; }
        p { color: #9fb0bb; }
        a { display: inline-block; margin-top: 1.5rem; padding: .75rem 1.25rem; border-radius: 8px; background: #2de2c8; color: #04201c; text-decoration: none; font-weight: 600; }
        a:focus-visible { outline: 3px solid #e8eef2; outline-offset: 3px; }
        @media (prefers-color-scheme: light) { body { background: #f6f8f9; color: #12181c; } p { color: #4a5a64; } a { background: #0a7c6d; color: #fff; } }
    </style>
</head>
<body>
    <main>
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true" fill="none" stroke="#2de2c8" stroke-width="2"><circle cx="36" cy="36" r="30"/><ellipse cx="36" cy="36" rx="12" ry="30"/><path d="M6 36h60"/></svg>
        <h1>Şu an çevrimdışısın</h1>
        <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı geri geldiğinde sayfayı yenileyebilirsin. Panel ve hesap bilgilerin güvenlik nedeniyle cihazda saklanmaz.</p>
        <a href="/">Tekrar dene</a>
    </main>
</body>
