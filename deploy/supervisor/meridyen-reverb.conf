; Meridyen Roleplay — Laravel Reverb WebSocket sunucusu (docs/OPERATIONS.md §1, ARCHITECTURE §9 — Faz 10)
; Yalnızca BROADCAST_CONNECTION=reverb iken gereklidir. Sunucu 127.0.0.1:8080'de dinler; dışarıya Nginx wss:// ile açılır.
[program:meridyen-reverb]
command=php /var/www/meridyen/artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
directory=/var/www/meridyen
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/meridyen/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
