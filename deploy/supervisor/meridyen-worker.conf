; Meridyen Roleplay — kuyruk işçileri (docs/OPERATIONS.md §1, ARCHITECTURE §10 öncelik sırası)
[program:meridyen-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/meridyen/artisan queue:work database --queue=critical,default,mail,bulk --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/meridyen
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/meridyen/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
