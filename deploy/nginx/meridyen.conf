# Meridyen Roleplay — Nginx site yapılandırması (docs/OPERATIONS.md §1). Alan adı ve sertifika yollarını değiştir.
server {
    listen 80;
    listen [::]:80;
    server_name meridyenrp.com www.meridyenrp.com;
    return 301 https://meridyenrp.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meridyenrp.com;
    root /var/www/meridyen/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/meridyenrp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meridyenrp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 16m;   # destek ekleri ≤ 3 × 5 MB

    # Güvenlik başlıkları uygulamadan gelir (SecurityHeaders: CSP nonce, HSTS, XFO, nosniff).

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Derlenmiş varlıklar: içerik hash'li → uzun cache
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker her zaman taze okunmalı (PWA güncellemesi)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Gerçek zaman (Faz 10, Reverb): wss://<alan-adı>/app/{key} → 127.0.0.1:8080. Yalnızca BROADCAST_CONNECTION=reverb iken.
    # .env: REVERB_HOST=<alan-adı>, REVERB_PORT=443, REVERB_SCHEME=https (istemci ve sunucu yayını bu adresi kullanır).
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Gizli dosyalar (.env, .git) asla sunulmaz
    location ~ /\.(?!well-known) { deny all; }
}
